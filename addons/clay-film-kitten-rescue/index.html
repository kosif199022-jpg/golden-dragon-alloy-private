<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kitten Rescue</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101a; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage canvas { height: min(100vh - 64px, (100vw) * 16 / 9); width: auto; aspect-ratio: 9 / 16; border-radius: 10px; box-shadow: 0 10px 40px #0008; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; gap: 10px; align-items: center; padding: 0 16px; background: #0009; }
  #ui button { background: #f4d6c4; color: #3a2a2a; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  #ui input[type=range] { flex: 1; }
  #ui span { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  body.render #ui { display: none; }
  body.render #stage canvas { height: 100vh; width: 100vw; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <button id="play">Pause</button>
  <button id="restart">Restart</button>
  <input id="scrub" type="range" min="0" max="20" step="0.01" value="0" />
  <span id="time">0.00 s</span>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
