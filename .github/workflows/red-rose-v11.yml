name: Red Rose V11 regression tests
on:
  push:
    paths:
      - "red-rose/**"
      - ".github/workflows/red-rose-v11.yml"
  pull_request:
    paths:
      - "red-rose/**"
      - ".github/workflows/red-rose-v11.yml"
jobs:
  test-red-rose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install cairosvg numpy opencv-python-headless
      - name: Run Red Rose independent tests
        working-directory: red-rose
        run: python -W error::ResourceWarning -m unittest discover -v
