<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>@font-face{font-family:Marhey;src:url(fonts/Marhey-700.ttf);font-weight:700}@font-face{font-family:Almarai;src:url(fonts/Almarai-Bold.ttf)}
html,body{margin:0;background:#141a3a;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// «الصبر» — chalk on a navy board (style card ST14 «طباشير على سبورة كحلي»): one idea per scene, drawn like chalk
// (rough double strokes + speck erosion), heavy Marhey titles in white / yellow / green, a UI cursor as the actor.
const W=1080,H=1920,DUR=44.839,cv=document.getElementById('c'),m=cv.getContext('2d');
const ck=document.createElement('canvas');ck.width=W;ck.height=H;const g=ck.getContext('2d');
const WH='#f3f0e6',YE='#f6c445',GR='#6fe0a0',RE='#e8525a',BL='#93a0d8';
const cl=x=>Math.max(0,Math.min(1,x)),seg=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k,eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,eo=k=>1-Math.pow(1-k,3);
const back=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function rng(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
// board + chalk erosion pattern, baked once
const BOARD=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),R=rng(8);x.fillStyle='#161d40';x.fillRect(0,0,W,H);
  const v=x.createRadialGradient(540,900,200,540,960,1250);v.addColorStop(0,'rgba(60,72,130,.22)');v.addColorStop(1,'rgba(4,6,20,.55)');x.fillStyle=v;x.fillRect(0,0,W,H);
  for(let i=0;i<5200;i++){x.fillStyle=`rgba(${R()<.5?255:0},${R()<.5?255:0},255,${0.012+R()*0.03})`;x.fillRect(R()*W,R()*H,1+R()*2.5,1+R()*2.5)}return c})();
const SPECK=(()=>{const c=document.createElement('canvas');c.width=540;c.height=960;const x=c.getContext('2d'),R=rng(41);for(let i=0;i<9000;i++){x.fillStyle=`rgba(0,0,0,${0.35+R()*0.5})`;const s=R()<.15?2.2:1;x.fillRect(R()*540,R()*960,s,s)}return c})();
function chalk(pts,col,w=5,close=false){g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';for(const[o,a,ww]of[[0,1,w],[1.6,.45,w*.5]]){g.globalAlpha=a;g.lineWidth=ww;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0]+o,p[1]-o):g.moveTo(p[0]+o,p[1]-o));if(close)g.closePath();g.stroke()}g.globalAlpha=1}
function partial(pts,k){if(k>=1)return pts;let L=0;const d=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);d.push(l);L+=l}let rem=L*k;const out=[pts[0]];
  for(let i=1;i<pts.length&&rem>0;i++){if(d[i-1]<=rem){out.push(pts[i]);rem-=d[i-1]}else{const f=rem/d[i-1];out.push([lerp(pts[i-1][0],pts[i][0],f),lerp(pts[i-1][1],pts[i][1],f)]);rem=0}}return out}
function txt(s,x,y,size,col,rev=1,al=1,align='center',font='Marhey'){if(rev<=0||al<=0)return;g.save();g.globalAlpha=al;g.font=`700 ${size}px ${font}`;g.textBaseline='middle';g.direction='rtl';g.textAlign=align;
  const w=g.measureText(s).width,xr=align==='center'?x+w/2:(align==='right'?x:x+w);if(rev<1){g.beginPath();g.rect(xr-w*rev-6,y-size,w*rev+12,size*2);g.clip()}g.fillStyle=col;g.fillText(s,x,y);g.restore()}
function glow(x,y,r,col,a){if(a<=0)return;const q=m.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,col.replace('A',a));q.addColorStop(1,col.replace('A',0));m.fillStyle=q;m.fillRect(x-r,y-r,2*r,2*r)}
function cursor(x,y,a=1){g.save();g.globalAlpha=a;g.translate(x,y);g.beginPath();g.moveTo(0,0);g.lineTo(0,58);g.lineTo(15,45);g.lineTo(27,70);g.lineTo(38,64);g.lineTo(26,40);g.lineTo(44,40);g.closePath();g.fillStyle='#1b2146';g.fill();g.strokeStyle=WH;g.lineWidth=4;g.lineJoin='round';g.stroke();g.restore()}
function hatch(poly,col,a){g.save();g.beginPath();poly.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.clip();g.globalAlpha=a*.22;g.fillStyle=col;g.fillRect(0,0,W,H);g.globalAlpha=a*.35;g.strokeStyle=col;g.lineWidth=1.5;
  for(let i=-H;i<W+H;i+=16){g.beginPath();g.moveTo(i,H);g.lineTo(i+H,0);g.stroke()}g.restore()}
// ================= scene 1: a bad day is not a bad life
const G1=[[290,1300],[350,1215],[372,1240],[440,1120],[462,1150],[520,1050],[548,1075],[575,985]],RD=[[575,985],[583,1012],[596,1008],[604,1050],[612,1046],[618,1078]],G2=[[618,1078],[660,1000],[682,1022],[760,860],[792,884],[900,650],[960,600],[1050,525]];
function s1(t){const k=eio(seg(t,3.3,4.7)),z=lerp(14,1.37,k),fx=lerp(596,670,k),fy=lerp(1035,910,k),sx=540,sy=lerp(1100,1130,k);const T=p=>[(p[0]-fx)*z+sx,(p[1]-fy)*z+sy];
  const dr=eo(seg(t,0.2,1.5)),all=[...G1,...RD.slice(1),...G2.slice(1)].map(T),red=RD.map(T),gcol=k>0.35?GR:RE;
  const under=[...all,[all[all.length-1][0],T([0,1640])[1]],[all[0][0],T([0,1640])[1]]];hatch(under,k>0.35?GR:RE,dr*(k>0&&k<1?0.8:1));
  if(k>0.35)hatch([...red,[red[red.length-1][0],T([0,1640])[1]],[red[0][0],T([0,1640])[1]]],RE,.9);
  chalk(partial(G1.map(T),dr*3),gcol,lerp(7,5,k));chalk(partial(G2.map(T),cl(dr*3-2)),gcol,lerp(7,5,k));chalk(partial(red,cl(dr*3-1)),RE,lerp(7,5,k));
  if(k>=1){const e=T(G2[G2.length-1]);chalk([[e[0]-34,e[1]-6],e,[e[0]-12,e[1]+30]],GR,5)}
  // the little person on the ledge of the drop
  const p=T([596,1008]),h=Math.max(15*z,34),a=seg(t,0.9,1.5);if(a>0&&h>6){g.save();g.globalAlpha=a;const hw=h*.2;chalk([[p[0]-hw,p[1]],[p[0]-hw*.6,p[1]-h*.42],[p[0]+hw*.6,p[1]-h*.42],[p[0]+hw,p[1]]],WH,Math.max(2,h*.035));
    chalk([[p[0]-hw*.7,p[1]-h*.42],[p[0]-hw*.8,p[1]-h*.68],[p[0]+hw*.8,p[1]-h*.68],[p[0]+hw*.7,p[1]-h*.42]],WH,Math.max(2,h*.035));
    g.beginPath();g.arc(p[0],p[1]-h*.84,h*.16,0,6.283);g.strokeStyle=WH;g.lineWidth=Math.max(2,h*.04);g.stroke();g.restore()}
  txt('يومٌ سيّئ',540,400,104,WH,eo(seg(t,0.1,0.9)));txt('لا يعني حياةً سيّئة',540,545,88,GR,eo(seg(t,3.5,4.7)))}
function s1glow(t){const k=eio(seg(t,3.3,4.7));glow(540,lerp(820,960,k),320,'rgba(232,82,90,A)',0.28*seg(t,1.6,2.4)*(1-k))}
// ================= scene 2: wait — everything comes in its time
function car(x,y,s,col=WH,fill=BL){g.save();g.translate(x,y);g.scale(s,s);const body=[[-150,10],[-148,-22],[-100,-34],[-58,-72],[42,-72],[92,-34],[146,-24],[152,8]];
  hatch(body.map(p=>[p[0]*s+x,p[1]*s+y]),fill,1);g.restore();chalk(body.map(p=>[p[0]*s+x,p[1]*s+y]),col,4,true);
  chalk([[-52,-62],[-90,-36],[-8,-36],[-8,-62]].map(p=>[p[0]*s+x,p[1]*s+y]),col,3,true);chalk([[4,-62],[4,-36],[80,-36],[38,-62]].map(p=>[p[0]*s+x,p[1]*s+y]),col,3,true);
  for(const wx of[-92,94]){g.beginPath();g.arc(x+wx*s,y+12*s,30*s,0,6.283);g.fillStyle='#161d40';g.fill();g.strokeStyle=col;g.lineWidth=4;g.stroke();g.beginPath();g.arc(x+wx*s,y+12*s,13*s,0,6.283);g.lineWidth=3;g.stroke()}}
function s2(t){const go=Math.max(0,t-13.4),sc=go<1.2?go*go*230:(331+(go-1.2)*552);            // world scroll once the light is green
  const TOP=1110,MID=1200,BOT=1290;chalk([[0,TOP],[W,TOP]],WH,4);chalk([[0,BOT],[W,BOT]],WH,5);
  g.strokeStyle=WH;g.lineWidth=4;g.setLineDash([46,40]);g.lineDashOffset=sc;g.beginPath();g.moveTo(0,MID);g.lineTo(W,MID);g.stroke();g.setLineDash([]);
  for(let i=0;i<14;i++){const gx=((i*173-sc)%1900+1900)%1900-200;chalk([[gx,TOP],[gx-7,TOP-16]],WH,2);chalk([[gx+6,TOP],[gx+11,TOP-13]],WH,2)}
  const lx=765-sc;if(lx>-120){chalk([[lx,TOP],[lx,1040]],WH,5);chalk([[lx-42,665],[lx+42,665],[lx+42,1040],[lx-42,1040]],WH,5,true);
    const on=t<12.0?0:(t<13.0?1:2);[[RE,745],[YE,852],[GR,960]].forEach(([c,y],i)=>{g.beginPath();g.arc(lx,y,30,0,6.283);if(i===on){g.fillStyle=c;g.fill()}g.strokeStyle=WH;g.lineWidth=3;g.stroke()})}
  // the one who would not wait: rushes through on red, later we pass his wreck
  const rx=lerp(-260,1500,seg(t,9.6,11.0));if(t>9.5&&t<11.1){car(rx,1150,1.0);for(let i=0;i<3;i++)chalk([[rx-190-i*26,1128+i*16],[rx-250-i*26,1128+i*16]],WH,3)}
  const wx=2650-sc;if(wx>-400&&wx<1500){g.save();g.translate(wx,1150);g.rotate(-0.2);g.translate(-wx,-1150);car(wx,1140,1.0);g.restore();
    chalk([[wx+120,1175],[wx+135,1105],[wx+185,1085],[wx+235,1110],[wx+245,1175]],WH,4,true);hatch([[wx+120,1175],[wx+135,1105],[wx+185,1085],[wx+235,1110],[wx+245,1175]],WH,.9);
    for(let i=0;i<5;i++){const u=((t*0.6+i/5)%1);g.beginPath();g.arc(wx+90+Math.sin(u*5+i)*18,1090-u*150,16+u*30,0,6.283);g.strokeStyle=`rgba(243,240,230,${.6*(1-u)})`;g.lineWidth=3;g.stroke()}}
  car(480+eio(seg(t,13.4,15.0))*60,1232+Math.sin(t*9)*(go>0?1.5:0),1.25);
  txt('اصبر...',540,515,100,WH,eo(seg(t,8.2,8.9)),1-seg(t,11.8,12.1));txt('كل شيء يأتي في وقته',540,515,88,YE,eo(seg(t,12.1,13.1)))}
function s2glow(t){const go=Math.max(0,t-13.4),sc=go<1.2?go*go*230:(331+(go-1.2)*552),lx=765-sc;if(lx<-200)return;const on=t<12.0?0:(t<13.0?1:2);
  glow(lx,[745,852,960][on],190,['rgba(232,82,90,A)','rgba(246,196,69,A)','rgba(111,224,160,A)'][on],0.5)}
// ================= scene 3: lower the ego and everything rises
const SL=[['السعادة',705,950,925,19.5],['اللطف',415,660,925,21.0],['التفاؤل',125,370,925,22.5],['الثقة',705,950,1265,24.0],['الاحترام',415,660,1265,25.2],['الأنا',125,370,1265,26.4]];
function sval(i,t){if(i===5)return 1-eio(seg(t,26.6,27.6));const t0=SL[i][4];const up=eio(seg(t,26.9+i*.12,27.9+i*.12));const tr=Math.sin(Math.PI*seg(t,t0+.3,t0+1.1))*0.22;return Math.max(up,tr*(1-up))}
function s3(t){const a=eo(seg(t,18.2,19.0));g.save();g.globalAlpha=a;SL.forEach(([name,x0,x1,y,t0],i)=>{const v=sval(i,t),kx=lerp(x1,x0,v),ego=i===5,won=t>26.9&&!ego;
    txt(name,(x0+x1)/2,y-108,72,ego&&t<27.2?YE:WH);
    chalk([[x0,y-11],[x1,y-11]],WH,4);chalk([[x0,y+11],[x1,y+11]],WH,4);g.beginPath();g.arc(x0,y,11,Math.PI/2,Math.PI*1.5);g.strokeStyle=WH;g.lineWidth=4;g.stroke();
    if(v>0.02){g.fillStyle=ego||won?YE:RE;g.fillRect(kx,y-8,x1-kx,16)}
    g.fillStyle='#454d7a';g.strokeStyle=WH;g.lineWidth=4;g.beginPath();g.roundRect(kx-12,y-34,24,68,11);g.fill();g.stroke();
    if(!ego&&t>t0+1.0&&t<t0+2.0&&t<26.6)txt('؟',x1+34,y-108,58,YE,1,Math.sin(Math.PI*seg(t,t0+1.0,t0+2.0)));
    if(won){const R=rng(i+3);for(let s=0;s<5;s++){const p=((t*1.1+R())%1),sx=lerp(x0,x1,R()),sy=y-20-p*46;g.fillStyle=`rgba(246,196,69,${.9*(1-p)})`;g.beginPath();g.arc(sx,sy,3.5*(1-p)+1,0,6.283);g.fill()}}});
  g.restore();
  // the cursor walks the sliders, fails on each, then drags the ego down
  let cx=420,cy=1500,ca=seg(t,18.6,19.2);for(let i=0;i<6;i++){const[,x0,x1,y,t0]=SL[i];if(t>=t0-0.5){const arrive=eio(seg(t,t0-0.5,t0+0.25)),v=sval(i,t),kx=lerp(x1,x0,i===5?v:(t<26.6?v:0));const px=i?SL[i-1][2]:420,py=i?SL[i-1][3]:1500;
      cx=lerp(i?lerp(px,SL[i-1][1],0)+0:px,kx-4,arrive);cy=lerp(py+ (i?10:0),y+12,arrive)}}
  if(t>27.7)ca=1-seg(t,27.7,28.2);cursor(cx,cy,ca);
  txt('قلّل الأنا..',540,450,90,WH,eo(seg(t,28.0,28.8)));txt('يرتفع كل شيء',540,590,92,YE,eo(seg(t,28.7,29.6)))}
function s3glow(t){const a=eo(seg(t,18.2,19.0));SL.forEach(([n,x0,x1,y],i)=>{const v=sval(i,t);if(i===5)glow((x0+x1)/2,y,210,'rgba(246,196,69,A)',0.33*v*a);else if(t>26.9)glow((x0+x1)/2,y,190,'rgba(246,196,69,A)',0.3*v)})}
// ================= scene 4: discipline, letter by letter
const AC=[['ا','لتزام'],['ن','موّ'],['ض','بط النفس'],['ب','ذل الجهد'],['ا','ستمرار'],['ط','موح']],WORD='انضباط';
function s4(t){const open=eio(seg(t,33.0,33.9)),closeK=eio(seg(t,37.9,38.8)),k=open*(1-closeK);
  g.font='700 170px Marhey';g.direction='rtl';const ww=g.measureText(WORD).width;
  if(k<1){const rev=eo(seg(t,30.9,31.9));txt(WORD,540,885,170,k>0.05?YE:WH,rev,1-k);
    const ul=eo(seg(t,32.0,32.7));if(ul>0&&k<.5){const gr=g.createLinearGradient(540-ww/2,0,540+ww/2,0);if(t>38){gr.addColorStop(0,YE);gr.addColorStop(1,RE)}else{gr.addColorStop(0,GR);gr.addColorStop(1,GR)}
      g.save();g.globalAlpha=1-k*2;g.strokeStyle=gr;g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(540+ww/2,1000);g.lineTo(540+ww/2-ww*ul,1000);g.stroke();g.restore()}}
  if(k>0){const XR=790;AC.forEach(([f,rest],i)=>{const y=lerp(885,520+i*152,k),size=lerp(170,92,k),word=f+rest;g.font=`700 ${size}px Marhey`;const wAll=g.measureText(word).width,wRest=g.measureText(rest).width,w1=Math.max(18,wAll-wRest);
      const type=eo(seg(t,33.8+i*.22,34.9+i*.22))*(1-seg(t,37.6,38.0));const xr=lerp(540+ww/2-i*(ww/6),XR,k);
      // the whole word in white, typed after its first letter; then the first letter again in yellow, clipped to its own width
      const rev=Math.max((w1+4)/wAll,type);txt(word,xr,y,size,WH,rev,k,'right');
      g.save();g.beginPath();g.rect(xr-w1-2,y-size,w1+10,size*2);g.clip();txt(word,xr,y,size,YE,1,k,'right');g.restore()})}}
// ================= scene 5: follow card (owner's own)
function s5(t){txt('تابع للمزيد',540,660,104,WH,eo(seg(t,40.6,41.3)));txt('Mahmoud Elkosif',540,815,70,YE,eo(seg(t,41.3,42.0)));
  const b=eo(seg(t,41.8,42.4)),done=seg(t,43.0,43.25);if(b>0){g.save();g.globalAlpha=b;const x=325,y=1055,w=430,h=112;g.beginPath();g.roundRect(x,y,w,h,26);if(done>0){g.fillStyle=YE;g.globalAlpha=b*done;g.fill();g.globalAlpha=b}g.strokeStyle=done>0?YE:WH;g.lineWidth=5;g.stroke();g.restore();
    txt(done>0.5?'✓ تمت المتابعة':'+ متابعة',540,1113,50,done>0.5?'#1b2146':WH,1,b)}
  txt('مونتاج وإخراج Mahmoud Elkosif',540,1290,44,WH,1,seg(t,41.9,42.5),'center','Almarai');txt('تابعني على فيسبوك',540,1352,34,BL,1,seg(t,41.9,42.5),'center','Almarai');
  const ca=seg(t,42.1,42.6),ck2=eio(seg(t,42.2,42.95));cursor(lerp(900,600,ck2),lerp(1750,1120,ck2)+ (t>42.95&&t<43.1?6:0),ca);
  if(t>43.05){const R=rng(77);for(let i=0;i<7;i++){const a=R()*6.283,d=eo(seg(t,43.05,43.9))*(150+R()*130),x=540+Math.cos(a)*d*1.5,y=1110+Math.sin(a)*d*.8,s=14+R()*12,al=1-seg(t,43.7,44.6);
    g.save();g.globalAlpha=al;g.fillStyle=i%2?RE:YE;g.beginPath();g.moveTo(x,y+s*.3);g.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);g.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);g.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);g.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);g.fill();g.restore()}}}
const SC=[[0,7.7,s1,s1glow],[7.7,17.9,s2,s2glow],[17.9,30.7,s3,s3glow],[30.7,40.4,s4,null],[40.4,DUR+1,s5,null]];
async function render(t){
  m.globalAlpha=1;m.drawImage(BOARD,0,0);g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);g.globalAlpha=1;
  const sc=SC.find(s=>t>=s[0]&&t<s[1])||SC[SC.length-1],fade=Math.min(seg(t,sc[0],sc[0]+.3),sc[1]>DUR?1:1-seg(t,sc[1]-.35,sc[1]));
  if(sc[3]){m.save();m.globalAlpha=fade;sc[3](t);m.restore()}
  g.save();sc[2](t);g.restore();
  g.save();g.globalCompositeOperation='destination-out';g.drawImage(SPECK,0,0,W,H);g.restore();            // chalk grain on everything drawn
  m.globalAlpha=fade;m.drawImage(ck,0,0);m.globalAlpha=1;
  m.save();m.font='700 24px Almarai';m.textAlign='center';m.direction='ltr';m.fillStyle='rgba(243,240,230,.45)';m.fillText('© Mahmoud Elkosif',540,1818);m.restore();
}
Promise.all(['700 40px Marhey','700 40px Almarai'].map(f=>document.fonts.load(f))).then(async()=>{await render(0);window.__kosifReady=true});
window.__kosif={duration:DUR,seek:async t=>{await render(t)}};
</script></body></html>
