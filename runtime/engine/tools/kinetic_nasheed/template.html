function balloons(t){for(const b of BL){const y=(b.y-(t-26)*b.v+H*4)%(H+300)-150,x=b.x+Math.sin(t+b.y)*12;g.strokeStyle='rgba(251,248,239,.5)';g.lineWidth=2;g.beginPath();g.moveTo(x,y+b.s);g.lineTo(x+8,y+b.s+120);g.stroke();heart(x,y-b.s*.4,b.s,b.c,.9)}}
const BK=(()=>{const R=rng(21),a=[];for(let i=0;i<14;i++)a.push([R()*W,R()*H,40+R()*90,R()*6]);return a})();
function bokeh(t){for(const[x,y,r,p]of BK){g.fillStyle=`rgba(255,255,255,${.06+.04*Math.sin(t+p)})`;g.beginPath();g.arc(x,y+Math.sin(t*.5+p)*20,r,0,6.283);g.fill()}}
function watermark(){g.save();g.font='700 24px Tajawal';g.direction='ltr';g.textAlign='left';g.textBaseline='middle';g.fillStyle='rgba(255,255,255,.6)';g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=6;g.fillText('© Mahmoud Elkosif',40,1885);g.restore()}
function credit(t){const k=eo(seg(t,62.8,63.5));if(k<=0)return;g.save();g.globalAlpha=k;g.textAlign='center';g.direction='rtl';g.font='700 44px Tajawal';g.fillStyle=C.cr;g.fillText('مونتاج وإخراج Mahmoud Elkosif',540,1580);g.font='700 32px Tajawal';g.fillStyle='rgba(239,233,216,.8)';g.fillText('تابعني على فيسبوك',540,1636);g.restore()}
async function render(t){let i=S.findIndex(s=>t>=s[0]&&t<s[1]);if(i<0)i=S.length-1;g.save();S[i][2](t);g.restore();credit(t);watermark()}
Promise.all(['700 40px Naskh','700 40px Tajawal'].map(f=>document.fonts.load(f))).then(async()=>{await render(0);window.__kosifReady=true});
window.__kosif={duration:DUR,seek:async t=>{await render(t)}};
