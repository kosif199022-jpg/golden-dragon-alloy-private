<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Ruqaa;src:url(fonts/ArefRuqaa-Bold.ttf);font-weight:700}
@font-face{font-family:Tajawal;src:url(fonts/Tajawal-Bold.ttf);font-weight:700}
html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// «كامل الأوصاف» — Abdel Halim Hafez. The cartoon couple in vintage 1960s Cairo.
const W=1080,H=1920,DUR=36.385011,cv=document.getElementById('c'),g=cv.getContext('2d');
const KN=150; // Kling clip frames (5 s at 30 fps)
// shots: [start,end,kind,src,camera {z0,z1,x0,x1,y0,y1}]
const SH=[
 [0,5.0,'img','img/c1.jpg',{z0:1.0,z1:1.08,x0:0,x1:0,y0:0,y1:-10,par:[.012,.006]}],
 [5.0,9.3,'img','img/c2.jpg',{z0:1.08,z1:1.0,x0:8,x1:-8,y0:0,y1:0,par:[-.012,.006]}],
 [9.3,14.3,'img','img/c3.jpg',{z0:1.0,z1:1.08,x0:0,x1:0,y0:0,y1:-10,par:[.012,.006]}],
 [14.3,18.6,'img','img/c4.jpg',{z0:1.14,z1:1.04,x0:0,x1:0,y0:150,y1:140,par:[-.014,.006]}],
 [18.6,23.4,'img','img/c5.jpg',{z0:1.0,z1:1.08,x0:0,x1:0,y0:0,y1:-10,par:[.012,.006]}],
 [23.4,27.6,'img','img/c6.jpg',{z0:1.08,z1:1.0,x0:-8,x1:8,y0:0,y1:0,par:[-.012,.006]}],
 [27.6,32.9,'img','img/c7.jpg',{z0:1.0,z1:1.08,x0:0,x1:0,y0:0,y1:-10,par:[.012,.006]}],
 [32.9,DUR,'img','img/c8.jpg',{z0:1.08,z1:1.0,x0:0,x1:0,y0:0,y1:0,par:[-.012,.006]}],
];
// lyric lines [start,end,text,red word]
const LY=[
 [0.25,4.75,'يا راميني','بسحر عينيك الاتنين'],
 [5.25,9.0,'ما تقولّي','واخدني ورايح فين؟'],
 [9.5,14.0,'يا راميني','بسحر عينيك الاتنين'],
 [14.5,18.3,'ما تقولّي','واخدني ورايح فين؟'],
 [18.75,20.75,'على جرح جديد؟',''],
 [21.0,23.2,'ولّا لتنهيد؟',''],
 [23.5,27.3,'ولّا ع الفرح','موديني؟'],
 [28.0,30.5,'أنا بسأل ليه؟',''],
 [30.75,32.75,'واحتار كده ليه؟',''],
 [33.0,36.2,'بكره الأيام','هتورّيني']
];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const CACHE=new Map(),LAST=new Map();
function load(src){if(CACHE.has(src))return CACHE.get(src);const p=new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=src});CACHE.set(src,p);if(CACHE.size>16)CACHE.delete(CACHE.keys().next().value);return p}
function once(src,n){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=n?src+'?r='+n:src})}
async function sure(src){let im=await load(src);for(let n=1;!im&&n<4;n++){CACHE.delete(src);im=await once(src,n);if(im)CACHE.set(src,Promise.resolve(im))}
  if(im)LAST.set(src,im);return im||LAST.get(src)||null}
async function shotImage(s,t){
  if(s[2]==='img')return sure(s[3]);
  if(s[2]==='seq'){const n=s[4].n;const lt=(t-s[0])*(n/30)/(s[1]-s[0]);const k=Math.min(n,Math.max(1,Math.floor(lt*30)+1));
    let im=await load(`${s[3]}/f${String(k).padStart(4,'0')}.jpg`);if(im)LAST.set(s[3],im);else im=LAST.get(s[3]);return im}
  const lt=(t-s[0])*(KN/30)/(s[1]-s[0]); // stretch 5.0 s clip to the line length
  const k=Math.min(KN,Math.max(1,Math.floor(lt*30)+1));
  let im=await load(`k/f${String(k).padStart(4,'0')}.jpg`);if(im)LAST.set('k',im);else im=LAST.get('k');return im}
// ---- 2.5D life engine (WebGL): depth parallax, sway, bob, blink, twinkling lights, water ripple, light sweep
const glc=document.createElement('canvas');glc.width=W;glc.height=H;const G=glc.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
const VS='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS=`precision highp float;uniform sampler2D T,D;uniform float t,z,sw;uniform vec2 pan,par,rip;uniform vec4 bob,glow,e1,e2;uniform vec2 bobd;uniform float bl;
float eye(vec2 p,vec4 e){vec2 q=(p-e.xy)/e.zw;return 1.-smoothstep(.35,1.,length(q));}
void main(){vec2 uv=vec2(gl_FragCoord.x/1080.,1.-gl_FragCoord.y/1920.);
 vec2 p=(uv-.5)/z+.5-pan;
 float d=texture2D(D,p).r;
 vec2 cam=par*vec2(sin(t*.7),cos(t*.55))+par*.6*(sw-.5);
 vec2 o=(d-.35)*cam;
 float fg=smoothstep(.45,.8,d);
 o+=fg*vec2(.0022*sin(t*1.5+p.y*7.+p.x*3.),.0016*sin(t*1.1+p.x*4.));
 float bw=exp(-dot(p-bob.xy,p-bob.xy)/(bob.z*bob.z))*fg;
 float piv=bobd.x>0.?clamp((bobd.x-p.y)/.45,0.,1.):1.;
 o+=bw*piv*vec2(bob.w*sin(t*1.9),bobd.y*0.+ (bob.w>0.?0.:0.));
 o.y+=bw*bobd.y*sin(t*1.9+1.2);
 float wr=smoothstep(rip.x,rip.x+.03,p.y)*(1.-smoothstep(rip.y-.03,rip.y,p.y))*(1.-fg);
 o.x+=wr*.0035*sin(p.y*260.+t*3.2);o.y+=wr*.0012*sin(p.x*60.-t*2.1);
 vec2 s=p-o;
 float w1=eye(s,e1),w2=eye(s,e2);
 vec3 c=texture2D(T,s).rgb;
 float l=dot(c,vec3(.3,.59,.11));
 float warm=smoothstep(.62,.92,l)*smoothstep(.0,.12,c.r-c.b)*(1.-.75*fg);
 float n=sin(s.x*41.+t*2.3)*sin(s.y*33.-t*1.9)+.6*sin(s.x*17.-s.y*23.+t*3.1);





 gl_FragColor=vec4(c,1.);}`;
const PRG=!G?null:(()=>{const mk=(ty,src)=>{const sh=G.createShader(ty);G.shaderSource(sh,src);G.compileShader(sh);if(!G.getShaderParameter(sh,G.COMPILE_STATUS))throw new Error(G.getShaderInfoLog(sh));return sh};
 const p=G.createProgram();G.attachShader(p,mk(G.VERTEX_SHADER,VS));G.attachShader(p,mk(G.FRAGMENT_SHADER,FS));G.linkProgram(p);G.useProgram(p);
 const b=G.createBuffer();G.bindBuffer(G.ARRAY_BUFFER,b);G.bufferData(G.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),G.STATIC_DRAW);const a=G.getAttribLocation(p,'a');G.enableVertexAttribArray(a);G.vertexAttribPointer(a,2,G.FLOAT,false,0,0);return p})();
const U=n=>G.getUniformLocation(PRG,n),TEX=new Map();
function tex(src,im){let x=TEX.get(src);if(!x){x=G.createTexture();G.bindTexture(G.TEXTURE_2D,x);G.texImage2D(G.TEXTURE_2D,0,G.RGBA,G.RGBA,G.UNSIGNED_BYTE,im);G.texParameteri(G.TEXTURE_2D,G.TEXTURE_MIN_FILTER,G.LINEAR);G.texParameteri(G.TEXTURE_2D,G.TEXTURE_MAG_FILTER,G.LINEAR);G.texParameteri(G.TEXTURE_2D,G.TEXTURE_WRAP_S,G.CLAMP_TO_EDGE);G.texParameteri(G.TEXTURE_2D,G.TEXTURE_WRAP_T,G.CLAMP_TO_EDGE);TEX.set(src,x)}return x}
async function life(s,t,im){const c=s[4],lt=t-s[0],sw=cl(lt/(s[1]-s[0])),e=eio(sw);const dm=await sure(s[3].replace('.jpg','_d.png'));
 G.activeTexture(G.TEXTURE0);G.bindTexture(G.TEXTURE_2D,tex(s[3],im));G.uniform1i(U('T'),0);
 G.activeTexture(G.TEXTURE1);G.bindTexture(G.TEXTURE_2D,tex(s[3]+'d',dm));G.uniform1i(U('D'),1);
 G.uniform1f(U('t'),lt);G.uniform1f(U('sw'),sw);G.uniform1f(U('z'),lerp(c.z0,c.z1,e)*1.06);
 G.uniform2f(U('pan'),lerp(c.x0,c.x1,e)/W,lerp(c.y0,c.y1,e)/H);G.uniform2f(U('par'),c.par[0],c.par[1]);
 const b=c.bob||[0,0,1,0,0,0];G.uniform4f(U('bob'),b[0],b[1],b[2],b[3]);G.uniform2f(U('bobd'),b[5],b[4]);
 const r=c.rip||[2,2];G.uniform2f(U('rip'),r[0],r[1]);const gw=c.glow||[0,0,1,0];G.uniform4f(U('glow'),gw[0],gw[1],gw[2],gw[3]);
 const ey=c.eyes||[9,9,.01,.01,9,9,.01,.01];G.uniform4f(U('e1'),ey[0],ey[1],ey[2],ey[3]);G.uniform4f(U('e2'),ey[4],ey[5],ey[6],ey[7]);
 let bl=c.eyes?.5+.5*Math.sin(lt*4.2):0;G.uniform1f(U('bl'),bl);
 G.viewport(0,0,W,H);G.drawArrays(G.TRIANGLE_STRIP,0,4);G.finish()}
async function drawShot(s,t,alpha){
  const im=await shotImage(s,t);if(!im)return;if(s[2]==='img'&&s[4].par){await life(s,t,im);g.save();g.globalAlpha=alpha;g.drawImage(glc,0,0);g.restore();return}const c=s[4],e=eio(seg(t,s[0],s[1]));
  const z=lerp(c.z0,c.z1,e),dx=lerp(c.x0,c.x1,e),dy=lerp(c.y0,c.y1,e);
  const k=Math.max(W/im.width,H/im.height)*z,iw=im.width*k,ih=im.height*k;
  g.save();g.globalAlpha=alpha;if(s[2]==='seq')g.filter='saturate(1.15) contrast(1.05) blur(.4px)';g.drawImage(im,(W-iw)/2+dx,(H-ih)/2+dy,iw,ih);g.filter='none';
  if(s[2]==='kling'){// the start frame carried the old title: cover the top band with the clip's own fog colour
    const fg=g.createLinearGradient(0,0,0,480);fg.addColorStop(0,'rgb(110,121,120)');fg.addColorStop(.8,'rgba(155,168,168,1)');fg.addColorStop(1,'rgba(157,170,170,0)');g.fillStyle=fg;g.fillRect(0,0,W,480);
    const bl=g.createLinearGradient(0,1820,0,1920);bl.addColorStop(0,'rgba(60,64,70,0)');bl.addColorStop(1,'rgba(60,64,70,.9)');g.fillStyle=bl;g.fillRect(0,1820,420,100)}
  g.restore()}
// seeded particles
function rng(s){return()=>{s=(s*16807)%2147483647;return s/2147483647}}
const RAIN=(()=>{const R=rng(7),a=[];for(let i=0;i<170;i++)a.push({x:R()*1300-110,y:R()*H,v:900+R()*700,l:24+R()*30,o:.12+R()*.22});return a})();
function rain(t,amt){if(amt<=0)return;g.save();g.strokeStyle='#fff';g.lineWidth=1.6;for(const d of RAIN){const y=(d.y+t*d.v)%(H+80)-40,x=d.x+((d.y+t*d.v)/(H+80)|0)*0+ (y*0.12);g.globalAlpha=d.o*amt;g.beginPath();g.moveTo(x,y);g.lineTo(x-d.l*.12,y-d.l);g.stroke()}g.restore()}
const PET=(()=>{const R=rng(31),a=[];for(let i=0;i<46;i++)a.push({x:R()*W,y:R()*H,s:10+R()*14,v:70+R()*90,w:R()*6.28,sp:.6+R()*1.4});return a})();
function petals(t,a0,a1,amt){const k=cl(seg(t,a0,a0+1))*(1-seg(t,a1-0.8,a1))*amt;if(k<=0)return;g.save();for(const p of PET){const y=(p.y+t*p.v)%(H+60)-30,x=p.x+Math.sin(t*p.sp+p.w)*40;g.globalAlpha=.85*k;g.translate(x,y);g.rotate(t*p.sp+p.w);g.fillStyle='#fff3f6';g.beginPath();g.ellipse(0,0,p.s,p.s*.55,0,0,6.283);g.fill();g.setTransform(1,0,0,1,0,0)}g.restore()}
function heart(x,y,s){g.beginPath();g.moveTo(x,y+s*.3);g.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);g.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.75,x,y+s);g.bezierCurveTo(x,y+s*.75,x+s*.5,y+s*.6,x+s*.5,y+s*.3);g.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);g.fill()}
const HEARTS=(()=>{const R=rng(99),a=[];for(let i=0;i<14;i++)a.push({x:120+R()*840,y:900+R()*700,s:18+R()*22,v:40+R()*50,ph:R()*6});return a})();
function hearts(t,a0,a1){const k=cl(seg(t,a0,a0+.8))*(1-seg(t,a1-.6,a1));if(k<=0)return;g.save();g.fillStyle='#e0213f';for(const h of HEARTS){const lt=t-a0,y=h.y-lt*h.v,x=h.x+Math.sin(lt*1.3+h.ph)*18;g.globalAlpha=k*.75*cl(1-(lt*h.v)/700);heart(x,y,h.s)}g.restore()}
const DUST=(()=>{const R=rng(5),a=[];for(let i=0;i<70;i++)a.push({x:R()*W,y:R()*H,r:1.5+R()*3.5,v:18+R()*40,ph:R()*6.28,sp:.8+R()*2});return a})();
function dust(t){g.save();g.globalCompositeOperation='lighter';for(const p of DUST){const y=H-((p.y+t*p.v)%(H+40)),x=p.x+Math.sin(t*.6+p.ph)*30,a=.25+.55*(.5+.5*Math.sin(t*p.sp+p.ph));const gr=g.createRadialGradient(x,y,0,x,y,p.r*4);gr.addColorStop(0,`rgba(255,226,150,${a})`);gr.addColorStop(1,'rgba(255,226,150,0)');g.fillStyle=gr;g.fillRect(x-p.r*4,y-p.r*4,p.r*8,p.r*8)}g.restore()}
const NOTES=(()=>{const R=rng(77),a=[];for(let i=0;i<9;i++)a.push({d:i*.5,dx:60+R()*260,s:44+R()*26,ph:R()*6,ch:R()>.5?'♪':'♫'});return a})();
function notes(t,a0,a1,x0,y0){if(t<a0||t>a1)return;g.save();g.textAlign='center';g.font='700 60px serif';for(const n of NOTES){const lt=((t-a0-n.d)%4.5+4.5)%4.5,k=lt/4.5;if(t-a0<n.d)continue;const x=x0+n.dx*k+Math.sin(lt*2+n.ph)*26,y=y0-k*520;g.globalAlpha=Math.sin(k*Math.PI)*.9*(1-seg(t,a1-.5,a1));g.font=`700 ${n.s}px serif`;g.shadowColor='rgba(255,200,90,.9)';g.shadowBlur=16;g.fillStyle='#ffe9b0';g.fillText(n.ch,x,y)}g.restore()}
const STARS=(()=>{const R=rng(13),a=[];for(let i=0;i<26;i++)a.push({x:R()*W,y:40+R()*560,ph:R()*6.28,sp:1.5+R()*3,r:5+R()*8});return a})();
function stars(t,a0,a1){const k=cl(seg(t,a0,a0+.8));if(k<=0||t>a1)return;g.save();g.globalCompositeOperation='lighter';g.strokeStyle='#fff';for(const s of STARS){const a=k*Math.max(0,Math.sin(t*s.sp+s.ph));g.globalAlpha=a*.9;g.lineWidth=1.6;g.beginPath();g.moveTo(s.x-s.r,s.y);g.lineTo(s.x+s.r,s.y);g.moveTo(s.x,s.y-s.r);g.lineTo(s.x,s.y+s.r);g.stroke()}g.restore()}
// lyric: line 1 white, line 2 red, word by word blur-in, at the top like the reference
function lyric(t,L){const[a,e,l1,l2]=L;if(t<a-.05||t>e+.35)return;
  const draw=(txt,y,size,fill,delay)=>{const ws=txt.split(' ');g.save();g.font=`700 ${size}px Ruqaa`;g.textBaseline='middle';g.direction='rtl';g.textAlign='right';
    let tot0=g.measureText(txt).width;if(tot0>960){size=Math.floor(size*960/tot0);g.font=`700 ${size}px Ruqaa`}
    const sp=g.measureText(' ').width,wd=ws.map(w=>g.measureText(w).width),tot=wd.reduce((p,q)=>p+q,0)+sp*(ws.length-1);let x=540+tot/2;
    ws.forEach((w,i)=>{const kin=eo(cl((t-a-delay-i*.12)/.5)),kout=eo(cl((t-e)/.35));const k=kin*(1-kout);if(k<=0){x-=wd[i]+sp;return}
      g.globalAlpha=k;g.filter=`blur(${(1-kin)*8}px)`;g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=18;if(fill!=='#ffffff'){g.shadowBlur=0;g.lineJoin='round';g.lineWidth=7;g.strokeStyle='rgba(255,255,255,.92)';g.strokeText(w,x,y+(1-kin)*16);g.shadowBlur=10}if(fill==='#ffffff'){g.lineJoin='round';g.lineWidth=6;g.strokeStyle='rgba(0,0,0,.55)';g.strokeText(w,x,y+(1-kin)*16)}g.fillStyle=fill;g.fillText(w,x,y+(1-kin)*16);x-=wd[i]+sp});g.restore()};
  draw(l1,l2?1200:1260,l2?96:104,'#ffffff',0);if(l2)draw(l2,1325,84,'#d0102c',.35)}
function vignette(){const v=g.createRadialGradient(540,1000,520,540,960,1300);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.38)');g.fillStyle=v;g.fillRect(0,0,W,H)}
function topShade(){const gr=g.createLinearGradient(0,0,0,560);gr.addColorStop(0,'rgba(10,30,50,.42)');gr.addColorStop(1,'rgba(10,14,24,0)');g.fillStyle=gr;g.fillRect(0,0,W,560)}
function credit(t,a){const k=eo(seg(t,a,a+.8));if(k<=0)return;
  g.save();g.globalAlpha=k;g.textAlign='center';g.direction='rtl';g.shadowColor='rgba(0,0,0,.8)';g.shadowBlur=12;
  g.font='700 80px Ruqaa';g.fillStyle='#fff';g.fillText('يا راميني',540,1500);
  g.font='700 40px Tajawal';g.fillStyle='#fff';g.fillText('مونتاج وإخراج Mahmoud Elkosif',540,1600);g.font='700 30px Tajawal';g.fillStyle='rgba(255,255,255,.8)';g.fillText('تابعني على فيسبوك',540,1652);g.restore()}
function watermark(){g.save();g.font='700 24px Tajawal';g.direction='ltr';g.textAlign='left';g.textBaseline='middle';g.fillStyle='rgba(255,255,255,.6)';g.shadowColor='rgba(0,0,0,.8)';g.shadowBlur=6;g.fillText('© Mahmoud Elkosif',40,1885);g.restore()}
// light wipe between shots: a soft diagonal sweep (no ghosting of the two faces)
const WIPE=.45;
async function render(t){g.fillStyle='#1a1d24';g.fillRect(0,0,W,H);
  let i=SH.findIndex(s=>t>=s[0]&&t<s[1]);if(i<0)i=SH.length-1;const s=SH[i];
  await drawShot(s,t,1);
  const nx=SH[i+1];
  if(nx&&t>nx[0]-WIPE){const k=eio(seg(t,nx[0]-WIPE,nx[0]));    // reveal next shot from the right edge as a sweep
    g.save();g.beginPath();const edge=lerp(W+400,-400,k);g.moveTo(edge,0);g.lineTo(W+600,0);g.lineTo(W+600,H);g.lineTo(edge-350,H);g.closePath();g.clip();await drawShot(nx,t,1);g.restore();
    }
  
  
  for(const L of LY)lyric(t,L);
  credit(t,33.3);
  // no fade from/to black at the start or end (owner: «الشاشة بتقفل وبتشغّل»)
  watermark()}
Promise.all(['700 40px Ruqaa','700 40px Tajawal'].map(f=>document.fonts.load(f))).then(async()=>{await render(0);window.__kosifReady=true});
window.__kosif={duration:DUR,seek:async t=>{await render(t)}};
</script></body></html>
