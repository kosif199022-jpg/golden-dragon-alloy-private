<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>codekit demo: three</title>
<style>
html,body{margin:0;background:#0b0d12;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b0d12}
h1{position:absolute;top:170px;left:0;right:0;margin:0;text-align:center;color:#f4f1ea;
   font:700 84px "Noto Kufi Arabic","Cairo","Segoe UI",Tahoma,"DejaVu Sans",sans-serif}
.tag{position:absolute;bottom:150px;left:0;right:0;text-align:center;color:#7f8796;direction:ltr;
   font:500 40px "Segoe UI",Tahoma,"DejaVu Sans",sans-serif}
canvas{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas><h1>{{TITLE}}</h1><div class="tag">Three.js · seek-driven</div></div>
<script src="./three.min.js"></script>
<script>
// Every frame is a pure function of t: no clock, no timers, no random numbers.
const D = 3;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(1080, 1920, false);
renderer.setClearColor(0x0b0d12, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1080 / 1920, 0.1, 100);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(3, 5, 6);
scene.add(key);
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.5, 0.45, 180, 28),
  new THREE.MeshStandardMaterial({color: 0xe0b354, metalness: 0.35, roughness: 0.35}));
scene.add(knot);
const ring = new THREE.Group();
for (let i = 0; i < 12; i++) {
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35),
    new THREE.MeshStandardMaterial({color: i % 2 ? 0x7fd1c8 : 0xe2574c, roughness: 0.5}));
  const a = i / 12 * Math.PI * 2;
  box.position.set(Math.cos(a) * 3.1, Math.sin(a) * 3.1, 0);
  ring.add(box);
}
scene.add(ring);
const easeOut = x => 1 - Math.pow(1 - x, 3);
function draw(t) {
  const p = t / D;
  knot.scale.setScalar(0.2 + 0.8 * easeOut(Math.min(1, t / 0.9)));
  knot.rotation.set(p * Math.PI, p * Math.PI * 2, 0);
  ring.rotation.z = -p * Math.PI * 1.5;
  ring.children.forEach((b, i) => b.rotation.set(p * 6 + i, p * 4, 0));
  camera.position.set(Math.sin(p * Math.PI) * 2.5, 0.6, 17 - 2.5 * p);
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
window.__kosif = {duration: D, seek: async t => { draw(Math.max(0, Math.min(D, t))); }};
draw(0);
window.__kosifReady = true;
</script>
</body>
</html>
