<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Marhey;src:url(fonts/Marhey-700.ttf);font-weight:700}
@font-face{font-family:Almarai;src:url(fonts/Almarai-Bold.ttf);font-weight:700}
html,body{margin:0;background:#f2ead8;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Almarai;color:#1b2146}
#gl,#rc{position:absolute;left:0;top:0}
h1{position:absolute;top:150px;width:100%;margin:0;text-align:center;font:700 128px Marhey;color:#1b2146}
h2{position:absolute;top:330px;width:100%;margin:0;text-align:center;font:700 52px Almarai;color:#7a5a12}
.chip{position:absolute;right:90px;width:900px;height:118px;border-radius:26px;background:rgba(255,255,255,.92);border:3px solid #d99a1c;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font:700 40px Almarai;opacity:0}
.chip b{font:700 34px Almarai;color:#1f7d72;direction:ltr}
#credit{position:absolute;top:1700px;width:100%;text-align:center;font:700 40px Almarai;opacity:0}
#credit small{display:block;font-size:30px;color:#7a6a4a;margin-top:10px}
#mark{position:absolute;left:40px;top:1870px;font:700 22px Almarai;color:rgba(27,33,70,.5);direction:ltr}
#mo{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
</style></head><body>
<div id="stage">
 <canvas id="gl" width="1080" height="1920"></canvas>
 <canvas id="rc" width="1080" height="1920"></canvas>
 <div id="mo"></div>
 <h1>التنين الأسود</h1><h2>مخرج الفيديو الذكي</h2>
 <div class="chip" style="top:1060px"><span>تصميم المشاهد</span><b>Three.js + Rough.js</b></div>
 <div class="chip" style="top:1200px"><span>التحريك والمؤثرات</span><b>GSAP + anime.js + mo.js</b></div>
 <div class="chip" style="top:1340px"><span>الصوت والمزامنة</span><b>faster-whisper + auto-editor</b></div>
 <div class="chip" style="top:1480px"><span>التجميع والتصدير</span><b>Dragon engine + FFmpeg</b></div>
 <div id="credit">مونتاج وإخراج Mahmoud Elkosif<small>تابعني على فيسبوك</small></div>
 <div id="mark">© Mahmoud Elkosif</div>
</div>
<script src="three.min.js"></script><script src="gsap.min.js"></script><script src="anime.umd.min.js"></script><script src="mo.umd.js"></script><script src="rough.js"></script>
<script>
// Five of the twelve tools in one frame, all driven by one clock t (codekit fusion demo):
// Three.js draws the 3D, Rough.js the hand-drawn frame, GSAP the titles, anime.js the chips, mo.js the burst.
const D=10;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1080,1920,false);renderer.setClearColor(0xf2ead8,1);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1080/1920,0.1,100);
scene.add(new THREE.AmbientLight(0xffffff,0.5));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(3,5,6);scene.add(key);
const rim=new THREE.PointLight(0x7fd1c8,60);rim.position.set(-4,-2,4);scene.add(rim);
const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.35,0.4,220,32),new THREE.MeshStandardMaterial({color:0xe0b354,metalness:0.55,roughness:0.28}));knot.position.y=1.2;scene.add(knot);
const ring=new THREE.Group();for(let i=0;i<16;i++){const b=new THREE.Mesh(new THREE.OctahedronGeometry(0.2),new THREE.MeshStandardMaterial({color:i%2?0x7fd1c8:0xe2574c,roughness:0.45}));const a=i/16*Math.PI*2;b.position.set(Math.cos(a)*2.9,Math.sin(a)*2.9,0);ring.add(b)}ring.position.y=1.2;scene.add(ring);
const rcv=document.getElementById('rc'),rctx=rcv.getContext('2d'),rc=rough.canvas(rcv);
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-x,3);
const g=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
g.fromTo('h1',{opacity:0,y:-90,scale:.7},{opacity:1,y:0,scale:1,duration:.9,ease:'back.out(1.6)'},0.3)
 .fromTo('h2',{opacity:0,y:40},{opacity:1,y:0,duration:.7},1.0)
 .to('h1',{color:'#d99a1c',duration:.25,yoyo:true,repeat:1},5.0)
 .to('#credit',{opacity:1,duration:.4},7.0);
const a=anime.createTimeline({autoplay:false,defaults:{ease:'outExpo'}});
a.add('.chip',{opacity:[0,1],translateX:[900,0],duration:900,delay:anime.stagger(380)},2000)
 .add('.chip',{scale:[1,1.04,1],duration:500,delay:anime.stagger(120)},5000);
const mroot=document.getElementById('mo'),at={parent:mroot,left:540,top:690};
const burst=new mojs.Burst({...at,radius:{60:520},count:18,delay:5000,children:{shape:'line',stroke:['#d99a1c','#1f7d72','#e2574c'],strokeWidth:10,radius:44,scale:{1:0},duration:1500,easing:'quad.out'}});
const halo=new mojs.Shape({...at,shape:'circle',radius:{0:430},fill:'none',stroke:'#d99a1c',strokeWidth:{40:0},delay:5000,duration:1300,easing:'cubic.out'});
const pad=new mojs.Tween({duration:D*1000}),m=new mojs.Timeline();m.add(burst,halo,pad);
function draw(t){t=Math.max(0,Math.min(D,t));const p=t/D;
  knot.scale.setScalar(0.15+0.85*eo(cl(t/1.2)));knot.rotation.set(p*Math.PI*1.2,p*Math.PI*2.4,0);ring.rotation.z=-p*Math.PI*1.6;ring.children.forEach((b,i)=>b.rotation.set(p*6+i,p*4,0));
  camera.position.set(Math.sin(p*Math.PI)*2.2,1.0,17-2.2*eo(p));camera.lookAt(0,0.4,0);renderer.render(scene,camera);
  rctx.clearRect(0,0,1080,1920);const boil=1+Math.floor(t*8);
  const u=eo(cl((t-1.3)/0.8));if(u>0)rc.line(540+330*u,470,540-330*u,470,{stroke:'#d99a1c',strokeWidth:7,roughness:2.2,seed:boil});
  const f=eo(cl((t-1.8)/1.0));if(f>0)rc.rectangle(60,1020,960*f,620,{stroke:'#1b2146',strokeWidth:4,roughness:2.4,seed:boil+50});
  g.time(t);a.seek(t*1000);m.setProgress(t/D)}
Promise.all(['700 40px Marhey','700 40px Almarai'].map(f=>document.fonts.load(f))).then(()=>{draw(0);window.__kosifReady=true});
window.__kosif={duration:D,seek:async t=>{draw(t)}};
</script></body></html>
