<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Fares Motion</title>
<style>
  :root {
    --bg: #1b1b1d; --surface: #242427; --surface-2: #2d2d31; --surface-3: #36363b;
    --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
    --text: #ececef; --muted: #8d8d95; --faint: #5f5f66;
    --accent: #93FF77; --accent-dim: rgba(147,255,119,.13); --accent-line: rgba(147,255,119,.35);
    --ink: #0f140d; --err: #ff6b6b; --err-dim: rgba(255,107,107,.12);
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.65 "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .latin { font-family: "Poppins", "Segoe UI", sans-serif; direction: ltr; unicode-bidi: isolate; }

  /* ---------- header */
  header { position: relative; z-index: 3; display: flex; align-items: center; gap: 9px; padding: 10px 12px;
    background: linear-gradient(180deg, #222225, #1d1d20); border-bottom: 1px solid var(--line); }
  .logo { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--ink); font: 900 14px/1 "Poppins", "Segoe UI", sans-serif;
    background: radial-gradient(120% 120% at 30% 20%, #c6ffb3 0%, var(--accent) 45%, #4fd13a 100%);
    box-shadow: 0 0 0 1px rgba(147,255,119,.35), 0 4px 14px rgba(147,255,119,.18); }
  .title { font-weight: 800; font-size: 14px; letter-spacing: .2px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; max-width: 150px;
    background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; transition: background .2s, box-shadow .2s; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px rgba(147,255,119,.7); }
  .dot.busy { background: #f5c451; box-shadow: 0 0 8px rgba(245,196,81,.7); animation: pulse 1.2s ease-in-out infinite; }
  .dot.bad { background: var(--err); }
  #skillPill { cursor: pointer; flex-shrink: 0; }
  #skillPill.none { color: #f5c451; border-color: rgba(245,196,81,.35); }
  #skillPill span { overflow: hidden; text-overflow: ellipsis; }
  @keyframes pulse { 50% { opacity: .35; } }
  .spacer { flex: 1; }
  .icon-btn { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); transition: background .15s, color .15s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn.active { background: var(--accent-dim); color: var(--accent); }

  /* ---------- settings sheet */
  #settings { position: absolute; z-index: 2; inset-inline: 10px; top: 52px; display: none; flex-direction: column; gap: 10px;
    padding: 14px; border-radius: var(--r); background: rgba(36,36,39,.97); border: 1px solid var(--line-2);
    box-shadow: 0 18px 40px rgba(0,0,0,.45); backdrop-filter: blur(8px); max-height: calc(100% - 64px); overflow-y: auto; }
  #settings.open { display: flex; animation: drop .18s ease-out; }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { color: var(--muted); font-size: 11.5px; }
  .input { width: 100%; font: inherit; color: var(--text); background: #18181a; border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 10px; }
  .input:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-dim); }
  select.input option { background: #242427; color: var(--text); }
  .row-in { display: flex; gap: 6px; }
  .row-in .input { flex: 1; }
  #newSkillRow { display: none; }
  #newSkillRow.show { display: flex; }
  #importRow { display: none; flex-direction: column; gap: 6px; }
  #importRow.show { display: flex; }
  #importRow .btn { flex: 1; }
  select.input optgroup { background: #242427; color: var(--muted); font-style: normal; }
  .hint { color: var(--faint); font-size: 10.5px; word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { height: 32px; padding: 0 14px; border-radius: 10px; font-weight: 700; background: var(--surface-3); border: 1px solid var(--line-2); white-space: nowrap; }
  .btn:hover { background: #404046; }
  .btn.primary { background: var(--accent); color: var(--ink); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.06); }

  /* ---------- conversation */
  #messages { flex: 1; overflow-y: auto; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 8px; } #messages::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 8px; border: 2px solid var(--bg); }
  .row { display: flex; gap: 9px; align-items: flex-start; animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
  .avatar { width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center; margin-top: 2px;
    background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-line); }
  .avatar svg { width: 13px; height: 13px; }
  .msg { white-space: pre-wrap; word-wrap: break-word; min-width: 0; }
  .msg.claude { flex: 1; padding-top: 2px; }
  .msg.user { max-width: 88%; margin-inline-start: auto; padding: 8px 12px; border-radius: 14px 14px 4px 14px;
    background: linear-gradient(180deg, rgba(147,255,119,.18), rgba(147,255,119,.11)); border: 1px solid var(--accent-line); }
  .msg.err { align-self: stretch; padding: 9px 12px; border-radius: 12px; background: var(--err-dim); border: 1px solid rgba(255,107,107,.35); color: #ffd2d2; }
  .msg b { color: #fff; }
  .msg code { font-family: Consolas, "Cascadia Code", Menlo, monospace; font-size: 12px; background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 5px; direction: ltr; unicode-bidi: isolate; }
  .msg pre { direction: ltr; text-align: left; background: #141416; border: 1px solid var(--line); padding: 10px 12px; border-radius: 10px; overflow-x: auto; margin: 6px 0; white-space: pre; }
  .msg pre code { background: none; padding: 0; }
  .cursor::after { content: ""; display: inline-block; width: 7px; height: 14px; margin-inline-start: 3px; vertical-align: -2px; border-radius: 2px; background: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* tool activity chips */
  .chip { align-self: flex-start; margin-inline-start: 33px; display: inline-flex; align-items: center; gap: 7px; max-width: calc(100% - 33px);
    padding: 4px 10px 4px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; animation: rise .2s ease-out; }
  .chip .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .ico { width: 13px; height: 13px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .chip.running .ico { border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  .chip.done { color: #c9cfc7; } .chip.done .ico { background: var(--accent); color: var(--ink); }
  .chip.done .ico::before { content: "✓"; font-size: 9px; font-weight: 900; }
  .chip.error { color: #ffb4b4; border-color: rgba(255,107,107,.3); background: var(--err-dim); } .chip.error .ico { background: var(--err); color: #2a0d0d; }
  .chip.error .ico::before { content: "!"; font-size: 9px; font-weight: 900; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* typing indicator */
  .typing { margin-inline-start: 33px; display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .35; animation: hop 1.1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 30% { opacity: 1; transform: translateY(-4px); } 60% { opacity: .35; transform: none; } }

  /* welcome */
  .welcome { margin: auto 0; padding: 18px 4px 6px; display: flex; flex-direction: column; gap: 12px; animation: rise .3s ease-out; }
  .welcome .big { font-size: 17px; font-weight: 800; }
  .welcome .big em { font-style: normal; color: var(--accent); }
  .welcome .sub { color: var(--muted); font-size: 12px; }
  .suggest { display: flex; flex-direction: column; gap: 7px; }
  .suggest button { text-align: start; padding: 9px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--text); transition: border-color .15s, background .15s, transform .15s; }
  .suggest button:hover { border-color: var(--accent-line); background: var(--surface-2); transform: translateX(-2px); }

  /* what Claude is looking at */
  .shot { margin-inline-start: 33px; max-width: calc(100% - 33px); animation: rise .2s ease-out; }
  .shot img { width: 100%; max-height: 220px; object-fit: contain; object-position: right; border-radius: 10px; border: 1px solid var(--accent-line); background: #1e1e1e; cursor: zoom-in; display: block; }
  .shot.big img { max-height: none; cursor: zoom-out; }
  .shot .cap { font-size: 11px; color: #9a9f97; margin-top: 4px; }

  /* ---------- composer */
  footer { padding: 8px 10px 10px; background: linear-gradient(0deg, #1b1b1d 70%, rgba(27,27,29,0)); }
  .composer { border-radius: 16px; background: var(--surface); border: 1px solid var(--line-2); transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-dim); }
  textarea { display: block; width: 100%; min-height: 44px; max-height: 180px; resize: none; font: inherit; color: var(--text);
    background: transparent; border: 0; padding: 11px 13px 4px; }
  textarea:focus { outline: none; } textarea::placeholder { color: var(--faint); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px 8px; }
  .toggle { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 999px; cursor: pointer; user-select: none; white-space: nowrap;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; transition: all .15s; }
  .toggle:hover { color: var(--text); }
  .toggle input { display: none; }
  .toggle.on { background: var(--accent-dim); border-color: var(--accent-line); color: var(--accent); }
  #learnBtn:hover { background: var(--accent-dim); border-color: var(--accent-line); color: var(--accent); }
  .select-wrap { position: relative; display: inline-flex; align-items: center; height: 28px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); padding-inline-start: 9px; }
  .select-wrap.on { background: var(--accent-dim); border-color: var(--accent-line); color: var(--accent); }
  .select-wrap svg { width: 13px; height: 13px; }
  .select-wrap select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 11.5px; color: inherit; background: transparent; border: 0; padding: 0 8px 0 10px; height: 26px; cursor: pointer; direction: ltr; }
  .select-wrap select:focus { outline: none; }
  .select-wrap select option { background: #242427; color: var(--text); }
  .mini { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--faint); }
  .mini:hover { background: var(--surface-2); color: var(--text); }
  .mini svg { width: 14px; height: 14px; }
  #send { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--ink); flex: none;
    box-shadow: 0 4px 14px rgba(147,255,119,.28); transition: transform .12s, filter .15s, background .15s; }
  #send:hover { filter: brightness(1.07); transform: translateY(-1px); }
  #send svg { stroke-width: 2.4; }
  #send.stop { background: var(--err); color: #2a0d0d; box-shadow: 0 4px 14px rgba(255,107,107,.3); }
  .statusline { display: flex; align-items: center; gap: 6px; padding: 6px 4px 0; color: var(--faint); font-size: 11px; }

  /* reference images */
  #attachments { display: none; flex-wrap: wrap; gap: 8px; padding: 10px 12px 0; }
  #attachments.has { display: flex; }
  .att { position: relative; width: 58px; height: 58px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line-2); background: #141416; animation: rise .18s ease-out; }
  .att img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att button { position: absolute; top: 3px; inset-inline-end: 3px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(0,0,0,.72); color: #fff; font-size: 11px; line-height: 1; }
  .att button:hover { background: var(--err); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .thumbs img { max-width: 120px; max-height: 120px; border-radius: 8px; border: 1px solid var(--accent-line); display: block; }
  #drop { position: fixed; inset: 0; z-index: 9; display: none; place-items: center; background: rgba(15,20,13,.82); border: 2px dashed var(--accent);
    border-radius: 14px; margin: 6px; color: var(--accent); font-size: 15px; font-weight: 800; pointer-events: none; }
  #drop.show { display: grid; }
</style>
</head>
<body>
  <header>
    <div class="logo">F</div>
    <span class="title">Fares Motion</span>
    <span class="spacer"></span>
    <button class="pill" id="skillPill" title="السكيل اللي البانل بتتعلم فيها وبتشتغل بيها (دوس للإعدادات)"><svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span class="latin" id="skillName">…</span></button>
    <button class="icon-btn" id="newChat" title="محادثة جديدة"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <button class="icon-btn" id="settingsBtn" title="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </header>

  <div id="settings">
    <label class="field"><span>فولدر الشغل (الميموري والسكيل والريفرنسات بتتحفظ فيه)</span>
      <div class="row-in"><input class="input latin" id="cwd" style="text-align:left"><button class="btn" id="openFolder">افتح</button></div></label>
    <label class="field"><span>السكيل (اللي Claude بيتعلم فيها وبيشتغل بيها)</span>
      <select class="input" id="skillSel"></select></label>
    <div class="row-in" id="newSkillRow"><input class="input latin" id="newSkill" placeholder="my-motion" style="text-align:left"><button class="btn primary" id="createSkill">اعمل السكيل</button></div>
    <div id="importRow">
      <div class="row-in"><button class="btn primary" id="importZip">📦 من ملف ZIP</button><button class="btn" id="importDir">📁 من فولدر</button></div>
      <div class="hint">أو اسحب ملف السكيل (.zip) وارميه على البانل في أي وقت.</div>
    </div>
    <button class="btn" id="exportSkill" title="اعمل ملف ZIP من السكيل المربوطة علشان تديه لحد تاني">📤 صدّر السكيل (ZIP) علشان تديها لحد</button>
    <input type="file" id="zipPick" accept=".zip,.skill" style="display:none">
    <input type="file" id="dirPick" webkitdirectory style="display:none">
    <label class="field"><span>الموديل</span>
      <select class="input" id="model">
        <option value="">الافتراضي في اشتراكك</option>
        <option value="opus">Opus</option>
        <option value="sonnet">Sonnet</option>
      </select></label>
    <div class="hint latin" id="exeHint"></div>
    <div class="actions">
      <button class="btn primary" id="saveSettings">حفظ</button>
      <button class="btn" id="loginBtn" title="سجّل دخول بحساب Claude بتاعك (ولو انت متسجّل، بيقولك بأنهي حساب)">تسجيل الدخول</button>
    </div>
  </div>

  <div id="messages"></div>

  <footer>
    <div class="composer">
      <div id="attachments"></div>
      <textarea id="input" rows="1" placeholder="اكتب لـ Claude…  (Enter للإرسال · Shift+Enter لسطر جديد · Ctrl+V لصورة)"></textarea>
      <div class="tools">
        <button class="mini" id="attachBtn" title="ابعت صورة ريفرنس"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg></button>
        <input type="file" id="filePick" accept="image/png,image/jpeg,image/webp,image/gif" multiple style="display:none">
        <label class="toggle" id="shotWrap" title="ابعت لـ Claude صورة من الكومب المفتوح عند مكان مؤشر الوقت">
          <input type="checkbox" id="shot">
          <svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>صورة الكومب
        </label>
        <button class="toggle" id="learnBtn" title="اختار اللايرز اللي عليها الأنيميشن في التايملاين ودوس هنا: Claude يقراها ويحفظها في السكيل. (لو كتبت اسم للأنيميشن في المربع هيتحفظ بيه)">
          <svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>اتعلّم الأنيميشن
        </button>
        <span class="select-wrap" id="effortWrap" title="مستوى التفكير: كل ما يعلى، Claude بيفكر أكتر والشغل بيطلع أحسن، بس بياخد وقت أطول وبيستهلك من الليمت أكتر">
          <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg>
          <select id="effort">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="xhigh">X-High</option>
            <option value="max">Max</option>
          </select>
        </span>
        <span class="spacer"></span>
        <button id="send" title="ابعت"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
      </div>
    </div>
    <div class="statusline"><span class="dot" id="dot"></span><span id="status">بيجهّز…</span></div>
  </footer>

  <div id="drop">ارمي صورة الريفرنس أو ملف السكيل (.zip) هنا</div>
  <script src="main.js"></script>
</body>
</html>
