<!doctype html>
<!-- Template for `hfc html2mp4`: 1080x1920 Arabic title card. Run `hfc fonts` first.
     Rules learned 2026-11-11: keep every layer inside ONE fixed full-viewport .stage with overflow:hidden
     (in RTL pages, anything wider than the viewport shifted the whole frame sideways);
     CSS animations start at t=0 and are seeked per frame; JS time (performance.now/rAF) runs on the paused fake clock. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#07070b}
  .stage{position:fixed;inset:0;overflow:hidden;font-family:"Cairo","Noto Naskh Arabic","DejaVu Sans",sans-serif;color:#f4efe6}
  .glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#b8892b66 0,#07070b 60%);
        transform-origin:50% 45%;animation:breathe 4s ease-in-out infinite alternate}
  .t{position:absolute;top:760px;left:0;right:0;text-align:center;font-weight:800;font-size:150px;
     opacity:0;transform:translateY(60px);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) .3s forwards}
  .s{position:absolute;top:980px;left:0;right:0;text-align:center;font-weight:600;font-size:56px;color:#d8b25a;
     opacity:0;animation:fade .9s ease-out 1.2s forwards}
  .bar{position:absolute;top:1080px;left:340px;height:6px;width:0;background:#d8b25a;animation:grow 1.4s ease-in-out 1.4s forwards}
  .n{position:absolute;bottom:220px;left:0;right:0;text-align:center;font:700 64px "Inter","DejaVu Sans",monospace;color:#ffffff99;direction:ltr}
  @keyframes rise{to{opacity:1;transform:none}} @keyframes fade{to{opacity:1}}
  @keyframes grow{to{width:400px}} @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.15)}}
</style></head><body>
<div class="stage">
  <div class="glow"></div><div class="t">التنين الأسود</div><div class="s">رندر سحابي مجاني</div><div class="bar"></div>
  <div class="n" id="n">0.00</div>
</div>
<script>
  // JS-driven layer: must print the frame time exactly (0.10 at frame 3 @30fps) if the fake clock is right
  const n = document.getElementById('n'), t0 = performance.now();
  (function tick(){ n.textContent = ((performance.now() - t0) / 1000).toFixed(2); requestAnimationFrame(tick); })();
</script></body></html>
