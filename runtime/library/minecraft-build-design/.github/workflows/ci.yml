name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml
      - name: Agent Skills spec
        run: python .github/scripts/validate_skill.py .
      - name: Release package builds
        run: python .github/scripts/package.py --check

  selftest:
    name: Selftest (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements.txt
      - name: Doctor
        run: python scripts/mcb.py doctor --brief
      - name: Selftest
        run: python scripts/mcb.py selftest

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: selftest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build package and release notes
        run: python .github/scripts/package.py --tag "${GITHUB_REF_NAME}" --notes release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/SHA256SUMS.txt
          --title "minecraft-build-design ${GITHUB_REF_NAME}"
          --notes-file release-notes.md
          --verify-tag
