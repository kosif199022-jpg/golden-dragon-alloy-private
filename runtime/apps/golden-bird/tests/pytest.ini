[pytest]
# Smoke tests for «الطائر الذهبي». Run them with run_tests.ps1 (app\build.ps1 does that before every build).
# no:cacheprovider keeps .pytest_cache out of this folder; temp files go to %TEMP% (pytest's tmp_path).
addopts = -p no:cacheprovider
testpaths = .
python_files = test_*.py
xfail_strict = false
