<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8">
<style>
body{margin:0;width:300px;background:#0b0d12;color:#e9e6df;font:14px/1.6 "Segoe UI",Tahoma,sans-serif;padding:14px}
h1{font-size:16px;color:#f0cf86;margin:0 0 6px}
.st{padding:6px 10px;border-radius:8px;background:#12151c;border:1px solid #232835;margin:8px 0;font-size:13px}
.ok{color:#5fbf8a}.bad{color:#e0695f}.wait{color:#f0cf86}
input{width:100%;box-sizing:border-box;padding:7px 9px;border-radius:8px;border:1px solid #232835;background:#07080b;color:#e9e6df;direction:ltr;margin:4px 0}
button{width:100%;padding:7px;border-radius:8px;border:1px solid #d6a84a;background:#d6a84a;color:#16120a;font-weight:700;cursor:pointer;margin-top:4px}
.sub{color:#8b8f9a;font-size:12px}
</style></head>
<body>
<h1>🐉 التنين الذهبي</h1>
<div class="sub">بيربط كروم بتطبيق التنين الذهبي على جهازك، عشان المساعد يقدر يفتح الصفحات ويقراها ويشغّلها لما تطلب منه.</div>
<div class="st" id="st">…</div>
<label class="sub">كود الربط (من التطبيق: الإعدادات ← إضافة كروم)</label>
<input id="tok" placeholder="الصق كود الربط هنا">
<button id="save">حفظ وربط</button>
<script src="popup.js"></script>
</body></html>
